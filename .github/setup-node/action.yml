name: 'Setup Node.js and install npm dependencies'
description: 'Configure Node.js and install npm dependencies while managing all aspects of caching.'
inputs:
    node-version:
        description: 'Optional. The Node.js version to use. When not specified, the version specified in .nvmrc will be used.'
        required: false

runs:
    using: 'composite'
    steps:
        - name: Use desired version of Node.js
          uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
          with:
              node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
              node-version: ${{ inputs.node-version }}
              check-latest: true
              cache: npm

        - name: Install custom npm with linked strategy fix
          run: |
              git clone --depth 1 --branch v11-gb-test https://github.com/manzoorwanijk/npm-cli.git /tmp/npm-cli
              cd /tmp/npm-cli && node scripts/resetdeps.js
              NPM_GLOBAL_DIR="$(npm root -g)/npm"
              rm -rf "$NPM_GLOBAL_DIR"
              ln -s /tmp/npm-cli "$NPM_GLOBAL_DIR"
              npm --version
          shell: bash

        - name: Install npm dependencies
          run: |
              npm ci
          shell: bash
        - name: Upload npm logs as an artifact on failure
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          if: failure()
          with:
              name: npm-logs
              path: C:\npm\cache\_logs
